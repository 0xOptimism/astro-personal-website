[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[edge_functions]]
  function = "mcp"
  path = "/mcp"

[[edge_functions]]
  function = "negotiate-markdown"
  path = "/*"

[[redirects]]
  from = "/.well-known/mcp"
  to = "/.well-known/mcp/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/mcp/server-card"
  to = "/.well-known/mcp.json"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/mcp/server-card.json"
  to = "/.well-known/mcp.json"
  status = 200
  force = true

[[headers]]
  for = "/.well-known/mcp.json"

  [headers.values]
    Content-Type = "application/mcp-server-card+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET"
    Access-Control-Allow-Headers = "Content-Type, If-None-Match"
    Access-Control-Expose-Headers = "ETag"
